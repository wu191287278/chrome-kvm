<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>设置 - Chrome KVM</title>
    <meta name="description" content="Chrome KVM">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 让原生下拉框的弹出列表也跟着用深色 */
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            /* 用 min-height 而不是 height，内容超出一屏时还能滚 */
            min-height: 100vh;
            padding: 32px 16px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #e4e4e7;
            background-color: #131316;
        }

        /* 和控制页工具栏同一套：半透明毛玻璃面板 */
        .form-container {
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            padding: 24px;
            background-color: rgba(39, 39, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        h2 {
            margin: 0 0 4px;
            font-size: 20px;
            font-weight: 600;
        }

        .page-hint {
            margin: 0;
            font-size: 13px;
            color: #a1a1aa;
        }

        /* 按视频 / 键鼠分组，和工具栏上那两个状态图标对应 */
        .section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #d4d4d8;
        }

        .section-title svg {
            width: 16px;
            height: 16px;
            color: #a1a1aa;
            flex-shrink: 0;
        }

        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #a1a1aa;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 32px 9px 10px;
            font: inherit;
            color: #e4e4e7;
            /* 必须是不透明色：半透明底会被 Chrome 合成到白底上，
               弹出列表就变成近白，而选项文字还是浅色，等于看不见 */
            background-color: #2e2e31;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            /* 自带的箭头在深底上很难看，换成和工具栏一致的细线箭头 */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            transition: border-color 0.15s, background-color 0.15s;
        }

        /* 弹出列表里每一行的配色靠 option 自己定，select 上的设置管不到 */
        select option {
            color: #e4e4e7;
            background-color: #26262a;
        }

        select:hover {
            border-color: rgba(255, 255, 255, 0.22);
        }

        select:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: -1px;
        }

        .confirm-button {
            font: inherit;
            padding: 9px 14px;
            color: #e4e4e7;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .confirm-button:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .confirm-button:focus-visible {
            outline: 2px solid #60a5fa;
            outline-offset: 1px;
        }

        /* 主操作用工具栏里表示「正常」的那个绿 */
        .confirm-button.primary {
            font-weight: 600;
            color: #0b0b0d;
            background-color: #3ddc84;
            border-color: transparent;
        }

        .confirm-button.primary:hover {
            background-color: #34c975;
        }

        .confirm-button.block {
            display: block;
            width: 100%;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions .confirm-button {
            flex: 1;
        }

        .hint {
            margin: 6px 0 0;
            font-size: 12px;
            color: #8b8b93;
        }

        code {
            padding: 1px 5px;
            font-size: 12px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .saved-line {
            margin: 0 0 6px;
            font-size: 12px;
            color: #a1a1aa;
            /* 设备名可能很长，别把面板撑破 */
            overflow-wrap: anywhere;
        }

        .saved-line:last-child {
            margin-bottom: 0;
        }

        .saved-line span {
            color: #d4d4d8;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>设备设置</h2>
    <p class="page-hint">选择采集卡和 CH9329 控制器，保存后回到控制页。浏览器的设备授权是按网址记的，换网址要重新授权。</p>

    <div class="section">
        <!-- 图标和控制页工具栏上的视频状态用的是同一个 -->
        <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="6" width="14" height="12" rx="2"/>
                <path d="M22 8l-6 4 6 4V8z"/>
            </svg>
            视频采集
        </div>
        <div class="field">
            <label for="choice1">视频（<a href="http://e.tb.cn/h.TfXLcXooYTXSM4E?tk=XEqJ3xEBB9g" target="_blank">USB
                视频采集卡</a>）</label>
            <select id="choice1" name="choice1"></select>
        </div>
        <div class="field">
            <label for="choice3">音频（<a href="http://e.tb.cn/h.TfXLcXooYTXSM4E?tk=XEqJ3xEBB9g" target="_blank">USB
                视频采集卡</a>）</label>
            <select id="choice3" name="choice3"></select>
        </div>
        <div class="field">
            <label for="choice4">屏幕分辨率</label>
            <select id="choice4" name="choice4">
                <option value="1920x1080">1920x1080</option>
                <option value="4096x2160">4096x2160</option>
                <option value="3840x2160">3840x2160</option>
                <option value="1680x1050">1680x1050</option>
                <option value="800x600">800x600</option>
                <option value="1280x960">1280x960</option>
                <option value="1280x1024">1280x1024</option>
                <option value="1360x768">1360x768</option>
                <option value="1440x1050">1440x1050</option>
                <option value="1440x900">1440x900</option>
                <option value="1600x900">1600x900</option>
                <option value="1600x1200">1600x1200</option>
            </select>
            <p class="hint">填被控端系统里实际设置的分辨率</p>
        </div>
        <button type="button" class="confirm-button block" onclick="authMedia()">授权视频采集卡</button>
    </div>

    <div class="section">
        <!-- 图标和工具栏上的键鼠状态一致 -->
        <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
                <rect x="1" y="8" width="14" height="10" rx="2"/>
                <path d="M4 11.5h.01"/>
                <path d="M7.5 11.5h.01"/>
                <path d="M11 11.5h.01"/>
                <path d="M4.5 14.5h6"/>
                <rect x="17" y="6" width="6" height="12" rx="3"/>
                <path d="M20 8.5v2"/>
            </svg>
            键鼠控制器
        </div>
        <div class="field">
            <label for="choice2">串口（<a href="http://e.tb.cn/h.TfXoUbjkCYXwmeW?tk=7Rlp3xEAdqD" target="_blank">CH9329
                键鼠控制器</a>）</label>
            <select id="choice2" name="choice2"></select>
            <p class="hint">Linux 下需要先给设备加权限：<code>chmod 666 /dev/ttyUSB0</code></p>
        </div>
        <div class="field">
            <label for="choice5">鼠标按键模式</label>
            <select id="choice5" name="choice5">
                <option value="absolute" selected>绝对模式</option>
                <option value="relative">相对模式</option>
            </select>
            <p class="hint" id="mouseModeHint">桌面用绝对模式；BIOS 等不支持绝对鼠标的场景用相对模式（尚未真机验证）</p>
        </div>
        <div class="field">
            <label for="choice6">串口波特率</label>
            <select id="choice6" name="choice6">
                <option value="9600">9600（芯片出厂默认）</option>
                <option value="115200">115200（鼠标更跟手）</option>
            </select>
            <p class="hint" id="baudHint">改波特率需要写进芯片，写入后断电重插 CH9329 才生效</p>
        </div>
        <div class="actions">
            <button type="button" class="confirm-button" onclick="authUsb()">授权控制器</button>
            <button type="button" class="confirm-button" onclick="applyBaudRate()">写入波特率</button>
        </div>
    </div>

    <div class="section" id="savedSection" style="display: none">
        <div class="section-title">当前已保存</div>
        <p class="saved-line" id="usedVideo" style="display: none"></p>
        <p class="saved-line" id="usedAudio" style="display: none"></p>
        <p class="saved-line" id="usedUsb" style="display: none"></p>
    </div>

    <div class="section">
        <div class="actions">
            <button type="button" class="confirm-button" onclick="window.location.href='./index.html'">返回控制页</button>
            <button type="button" class="confirm-button primary" onclick="save()">保存</button>
        </div>
    </div>
</div>
<script src="ch9329.js"></script>
<script>
    async function authUsb() {
        await navigator.serial.requestPort();
        window.location.reload();
    }

    async function authMedia() {
        navigator.mediaDevices.getUserMedia({video: true, audio: true})
            .then((stream) => {
                window.location.reload();
            })
    }

    function migrateSettings(settings) {
        if (!settings) {
            return settings;
        }
        // 旧版「绝对模式」实际写入 relative；无版本号时迁回 absolute。
        // 已是 absolute 的配置（含修复后重存）保持不变。
        if (!settings.mouseModeVersion) {
            if (settings.mouseClickMode !== "absolute") {
                settings.mouseClickMode = "absolute";
            }
            settings.mouseModeVersion = 1;
            window.localStorage.setItem("settings", JSON.stringify(settings));
        }
        return settings;
    }

    // 内置摄像头/麦克风一般不是采集卡，默认收起来减少干扰。
    // 注意中文 Windows 会把音频输入命名成「麦克风 (设备名)」，采集卡也可能中招
    const BUILTIN_HINTS = {
        videoinput: ["facetime", "相机", "microsoft"],
        audioinput: ["麦克风", "microsoft"]
    };

    function looksBuiltIn(device) {
        let hints = BUILTIN_HINTS[device.kind] || [];
        let label = (device.label || "").toLowerCase();
        for (let i = 0; i < hints.length; i++) {
            if (label.indexOf(hints[i]) !== -1) {
                return true;
            }
        }
        return false;
    }

    // 过滤只是便利：已保存的设备一定保留，全被过滤光时退回完整列表，
    // 否则会出现「设置里引用的设备在下拉框里根本选不到」
    function devicesForKind(devices, kind, savedDeviceId) {
        let all = devices.filter(function (device) {
            return device.kind === kind;
        });
        let visible = all.filter(function (device) {
            return !looksBuiltIn(device) || device.deviceId === savedDeviceId;
        });
        return visible.length ? visible : all;
    }

    function fillDeviceOptions(selector, list, savedDeviceId) {
        for (let i = 0; i < list.length; i++) {
            let device = list[i];
            let option = document.createElement("option");
            option.setAttribute("value", device.deviceId);
            option.innerText = device.label || ("未命名设备 " + String(device.deviceId).slice(0, 8));
            if (savedDeviceId && device.deviceId === savedDeviceId) {
                option.setAttribute("selected", "selected");
            }
            selector.appendChild(option);
        }
    }

    function renderMedia() {
        navigator.mediaDevices.enumerateDevices().then(devices => {
            let videoSelector = document.querySelector("#choice1");
            let audioSelector = document.querySelector("#choice3");
            let settingsStr = window.localStorage.getItem("settings");
            let settings = {};
            if (settingsStr) {
                settings = migrateSettings(JSON.parse(settingsStr))
            }


            let savedVideo = settings.video && settings.video.deviceId;
            let savedAudio = settings.audio && settings.audio.deviceId;
            fillDeviceOptions(videoSelector, devicesForKind(devices, "videoinput", savedVideo), savedVideo);
            fillDeviceOptions(audioSelector, devicesForKind(devices, "audioinput", savedAudio), savedAudio);

            let resolutionElement = document.querySelector("#choice4");
            if (settings.resolution && settings.resolution.width && settings.resolution.height) {
                for (let i = 0; i < resolutionElement.options.length; i++) {
                    let option = resolutionElement.options[i];
                    if (option.value === settings.resolution.width + "x" + settings.resolution.height) {
                        option.setAttribute("selected", "selected");
                    }
                }
            }

        })
    }

    function renderUsb() {

        let settingsStr = window.localStorage.getItem("settings");
        let settings = {};
        if (settingsStr) {
            settings = migrateSettings(JSON.parse(settingsStr))
        }
        navigator.serial.getPorts()
            .then((ports) => {
                let selector = document.querySelector("#choice2");
                let saved = null;
                if (settings.usb && settings.usb.deviceId) {
                    try {
                        saved = typeof settings.usb.deviceId === "string"
                            ? JSON.parse(settings.usb.deviceId)
                            : settings.usb.deviceId;
                    } catch (e) {
                        saved = null;
                    }
                }
                for (let i = 0; i < ports.length; i++) {
                    let port = ports[i];
                    let info = port.getInfo();
                    let htmlOptionElement = document.createElement("option");
                    htmlOptionElement.setAttribute("value", JSON.stringify(info));
                    htmlOptionElement.innerText = "usbProductId=" + info.usbProductId + "," + "usbVendorId=" + info.usbVendorId;
                    if (saved
                        && saved.usbVendorId === info.usbVendorId
                        && saved.usbProductId === info.usbProductId) {
                        htmlOptionElement.setAttribute("selected", "selected");
                    }
                    selector.appendChild(htmlOptionElement);
                }
            })
            .catch(e => {
                alert(e.message);
            })

        if (settings.mouseClickMode) {
            let selector = document.querySelector("#choice5");
            for (let i = 0; i < selector.options.length; i++) {
                let option = selector.options[i];
                if (option.value === settings.mouseClickMode) {
                    option.setAttribute("selected", "selected");
                }
            }
        }

        let baudSelector = document.querySelector("#choice6");
        for (let i = 0; i < baudSelector.options.length; i++) {
            let option = baudSelector.options[i];
            if (parseInt(option.value) === (settings.baudRate || 9600)) {
                option.setAttribute("selected", "selected");
            }
        }
    }

    function savedSerialFilter(settings) {
        if (!settings.usb || !settings.usb.deviceId) {
            return null;
        }
        try {
            return typeof settings.usb.deviceId === "string"
                ? JSON.parse(settings.usb.deviceId)
                : settings.usb.deviceId;
        } catch (e) {
            return null;
        }
    }

    // 下拉框里当前选中的端口优先：用户可能刚选好还没点保存
    function selectedSerialFilter() {
        let element = document.querySelector("#choice2");
        if (!element || element.selectedOptions.length === 0) {
            return null;
        }
        try {
            return JSON.parse(element.selectedOptions[0].value);
        } catch (e) {
            return null;
        }
    }

    function matchPort(ports, filter) {
        if (!filter) {
            return null;
        }
        for (let i = 0; i < ports.length; i++) {
            let info = ports[i].getInfo();
            if (info.usbVendorId === filter.usbVendorId && info.usbProductId === filter.usbProductId) {
                return ports[i];
            }
        }
        return null;
    }

    async function applyBaudRate() {
        let target = parseInt(document.querySelector("#choice6").value);
        let settings = JSON.parse(window.localStorage.getItem("settings") || "{}");
        let ports = await navigator.serial.getPorts();
        if (ports.length === 0) {
            alert("这个网址下还没有授权任何串口。请先点「点我授权键鼠控制器」。");
            return;
        }

        let filter = selectedSerialFilter() || savedSerialFilter(settings);
        let port = matchPort(ports, filter);
        if (!port) {
            if (ports.length === 1) {
                port = ports[0];
            } else {
                alert("有多个已授权的串口，请先在上面的下拉框里选中 CH9329 那个再写入。");
                return;
            }
        }
        console.log("写入波特率使用的串口：", port.getInfo());

        let connection = await Ch9329.connect(port, Ch9329.BAUD_RATES, true);
        if (!connection.info) {
            await connection.ch.dispose();
            try {
                await port.close();
            } catch (e) {
            }
            let detail = Ch9329.describeAttempts(connection.attempts);
            console.warn("CH9329 波特率探测失败：", connection.attempts);
            alert("CH9329 没有应答，无法写入波特率。\n\n探测结果：" + detail
                + "\n\n如果显示「打不开串口」，多半是 KVM 页面还占着这个端口，先关掉其它标签页再试。");
            return;
        }
        let result = await connection.ch.setBaudRate(target);
        await connection.ch.dispose();
        try {
            await port.close();
        } catch (e) {
        }
        if (!result.ok) {
            alert("写入失败：" + result.reason);
            return;
        }

        settings.baudRate = target;
        window.localStorage.setItem("settings", JSON.stringify(settings));
        if (result.unchanged) {
            alert("芯片波特率已经是 " + target + "，无需改动。");
            return;
        }
        alert("已写入 " + target + "。请把 CH9329 断电重插（拔掉 USB 再插回）后生效。");
    }

    function save() {
        let choice1 = document.querySelector("#choice1");
        let video = {}
        if (choice1.selectedOptions.length > 0) {
            let videoSelector = choice1.selectedOptions[0];
            let videoLabel = videoSelector.innerText;
            let videoDeviceId = videoSelector.value;
            video.label = videoLabel;
            video.deviceId = videoDeviceId;
        }

        let choice3 = document.querySelector("#choice3");
        let audio = {};
        if (choice3.selectedOptions.length > 0) {
            let option = choice3.selectedOptions[0];
            let audioLabel = option.innerText;
            let audioDeviceId = option.value;
            audio.label = audioLabel;
            audio.deviceId = audioDeviceId;
        }

        let usb = {}
        let usbElement = document.querySelector("#choice2");
        if (usbElement.selectedOptions.length > 0) {
            let option = usbElement.selectedOptions[0];
            let usbLabel = option.innerText;
            let usbDeviceId = option.value;
            usb.label = usbLabel;
            usb.deviceId = usbDeviceId;
        }
        let resolution = {width: 1920, height: 1080};
        let resolutionElement = document.querySelector("#choice4");
        if (resolutionElement.selectedOptions.length > 0) {
            let option = resolutionElement.selectedOptions[0];
            let split = option.value.split("x");
            resolution.width = parseInt(split[0]);
            resolution.height = parseInt(split[1]);
        }

        let config = {
            video: video,
            audio: audio,
            usb: usb,
            resolution: resolution,
            mouseClickMode: "absolute",
            mouseModeVersion: 1,
            baudRate: parseInt(document.querySelector("#choice6").value) || 9600
        };
        let mouseClickMode = document.querySelector("#choice5");
        if (mouseClickMode.value === "absolute" || mouseClickMode.value === "relative") {
            config.mouseClickMode = mouseClickMode.value;
        }

        window.localStorage.setItem("settings", JSON.stringify(config));
        alert("保存成功")
        window.location.reload();
    }

    function renderUsed() {
        let settingStr = window.localStorage.getItem("settings");
        if (!settingStr) {
            return;
        }
        let settings = migrateSettings(JSON.parse(settingStr));
        // 下拉框列的是「能选什么」，这里列的是「实际存了什么」，两者不一定一致
        let shown = 0;
        shown += showSavedLine("#usedVideo", "视频", settings.video);
        shown += showSavedLine("#usedAudio", "音频", settings.audio);
        shown += showSavedLine("#usedUsb", "控制器", settings.usb);
        if (shown > 0) {
            document.querySelector("#savedSection").style.display = "block";
        }
    }

    function showSavedLine(selector, name, device) {
        if (!device || !device.label) {
            return 0;
        }
        let element = document.querySelector(selector);
        element.innerHTML = name + "：<span></span>";
        element.querySelector("span").innerText = device.label;
        element.style.display = "block";
        return 1;
    }

    renderMedia();
    renderUsb();
    renderUsed();

    (function clearServiceWorkerAndCaches() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                    return Promise.all(registrations.map(function (registration) {
                        return registration.unregister();
                    }));
                })
                .catch(function () {});
        }
        if (typeof caches !== 'undefined' && caches.keys) {
            caches.keys()
                .then(function (keys) {
                    return Promise.all(keys.map(function (key) {
                        return caches.delete(key);
                    }));
                })
                .catch(function () {});
        }
    })();
</script>
</body>
</html>

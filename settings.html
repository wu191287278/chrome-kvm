<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Chrome KVM</title>
    <meta name="description" content="Chrome KVM">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
            color: #555;
        }

        select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .confirm-button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 8px;
        }

        .confirm-button:hover {
            background-color: #0056b3;
        }

        .separator {
            margin: 20px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>授权设备</h2>

    <div class="separator"></div>

    <!-- 第一个选择框 -->
    <form action="javascript:void(0)" method="post">
        <label for="choice1">视频 (<a href="http://e.tb.cn/h.TfXLcXooYTXSM4E?tk=XEqJ3xEBB9g" target="_blank">USB
            视频采集卡</a>):</label>
        <select id="choice1" name="choice1">
        </select>
        <br>
        <label for="choice3">音频 (<a href="http://e.tb.cn/h.TfXLcXooYTXSM4E?tk=XEqJ3xEBB9g" target="_blank">USB
            视频采集卡</a>):</label>
        <select id="choice3" name="choice3">
        </select>
        <label for="choice4">屏幕分辨率 (系统内设置的分辨率):</label>
        <select id="choice4" name="choice1">
            <option value="1920x1080">1920x1080</option>
            <option value="4096x2160">4096x2160</option>
            <option value="3840x2160">3840x2160</option>
            <option value="1680x1050">1680x1050</option>
            <option value="800x600">800x600</option>
            <option value="1280x960">1280x960</option>
            <option value="1280x1024">1280x1024</option>
            <option value="1360x768">1360x768</option>
            <option value="1440x1050">1440x1050</option>
            <option value="1440x900">1440x900</option>
            <option value="1600x900">1600x900</option>
            <option value="1600x1200">1600x1200</option>
        </select>
        <button type="button" class="confirm-button" onclick="authMedia()">点我授权视频采集卡</button>
        <br>
        <div class="separator"></div>
        <label for="choice2">串口 (<a href="http://e.tb.cn/h.TfXoUbjkCYXwmeW?tk=7Rlp3xEAdqD"
                                      target="_blank">CH9329键鼠控制器</a>) <br>Linux 需要增加权限: <br>chmod 666
            /dev/ttydUSB0</label>
        <select id="choice2" name="choice2">
        </select>
        <label for="choice5">鼠标按键模式</label>
        <select id="choice5" name="choice5">
            <option value="absolute" selected>绝对模式</option>
            <option value="relative">相对模式</option>
        </select>
        <p id="mouseModeHint" style="font-size: 12px; color: #888; margin: 4px 0 0;">
            桌面用绝对模式；BIOS 等不支持绝对鼠标的场景用相对模式（尚未真机验证）
        </p>

        <label for="choice6">串口波特率</label>
        <select id="choice6" name="choice6">
            <option value="9600">9600（芯片出厂默认）</option>
            <option value="115200">115200（鼠标更跟手）</option>
        </select>
        <button type="button" class="confirm-button" onclick="applyBaudRate()">写入 CH9329 芯片</button>
        <p id="baudHint" style="font-size: 12px; color: #888; margin: 4px 0 0;">
            改波特率需要写进芯片，写入后断电重插 CH9329 才生效
        </p>

        <br>
        <button type="button" class="confirm-button" onclick="authUsb()">点我授权键鼠控制器</button>
        <br>
        <div class="separator"></div>
        <button type="button" class="confirm-button" onclick="window.location.href='./index.html'">返回</button>
        <button type="button" class="confirm-button" onclick="save()">保存</button>
    </form>
    <p id="usedVideo" style="display: none">当前使用的视频设备:</p>
    <p id="usedAudio" style="display: none">当前使用的音频设备:</p>
    <p id="usedUsb" style="display: none">当前使用的控制器:</p>
</div>
</body>
<script src="ch9329.js"></script>
<script>
    async function authUsb() {
        await navigator.serial.requestPort();
        window.location.reload();
    }

    async function authMedia() {
        navigator.mediaDevices.getUserMedia({video: true, audio: true})
            .then((stream) => {
                window.location.reload();
            })
    }

    function migrateSettings(settings) {
        if (!settings) {
            return settings;
        }
        // 旧版「绝对模式」实际写入 relative；无版本号时迁回 absolute。
        // 已是 absolute 的配置（含修复后重存）保持不变。
        if (!settings.mouseModeVersion) {
            if (settings.mouseClickMode !== "absolute") {
                settings.mouseClickMode = "absolute";
            }
            settings.mouseModeVersion = 1;
            window.localStorage.setItem("settings", JSON.stringify(settings));
        }
        return settings;
    }

    function renderMedia() {
        navigator.mediaDevices.enumerateDevices().then(devices => {
            let videoSelector = document.querySelector("#choice1");
            let audioSelector = document.querySelector("#choice3");
            let settingsStr = window.localStorage.getItem("settings");
            let settings = {};
            if (settingsStr) {
                settings = migrateSettings(JSON.parse(settingsStr))
            }


            for (let i = 0; i < devices.length; i++) {
                let device = devices[i];
                let htmlOptionElement = document.createElement("option");
                htmlOptionElement.setAttribute("value", device.deviceId);
                htmlOptionElement.innerText = device.label;
                if (device.label.toLowerCase().indexOf("facetime") !== -1) {
                    continue
                }
                if (device.label.toLowerCase().indexOf("相机") !== -1) {
                    continue
                }
                if (device.label.toLowerCase().indexOf("麦克风") !== -1) {
                    continue
                }
                if (device.label.toLowerCase().indexOf("microsoft") !== -1) {
                    continue
                }
                if (device.kind === "audioinput") {
                    audioSelector.appendChild(htmlOptionElement);
                }
                if (device.kind === "videoinput") {
                    videoSelector.appendChild(htmlOptionElement);
                }
                if (settings.video && settings.video.deviceId === device.deviceId) {
                    htmlOptionElement.setAttribute("selected", "selected");
                }
                if (settings.audio && settings.audio.deviceId === device.deviceId) {
                    htmlOptionElement.setAttribute("selected", "selected");
                }
            }

            let resolutionElement = document.querySelector("#choice4");
            if (settings.resolution && settings.resolution.width && settings.resolution.height) {
                for (let i = 0; i < resolutionElement.options.length; i++) {
                    let option = resolutionElement.options[i];
                    if (option.value === settings.resolution.width + "x" + settings.resolution.height) {
                        option.setAttribute("selected", "selected");
                    }
                }
            }

        })
    }

    function renderUsb() {

        let settingsStr = window.localStorage.getItem("settings");
        let settings = {};
        if (settingsStr) {
            settings = migrateSettings(JSON.parse(settingsStr))
        }
        navigator.serial.getPorts()
            .then((ports) => {
                let selector = document.querySelector("#choice2");
                let saved = null;
                if (settings.usb && settings.usb.deviceId) {
                    try {
                        saved = typeof settings.usb.deviceId === "string"
                            ? JSON.parse(settings.usb.deviceId)
                            : settings.usb.deviceId;
                    } catch (e) {
                        saved = null;
                    }
                }
                for (let i = 0; i < ports.length; i++) {
                    let port = ports[i];
                    let info = port.getInfo();
                    let htmlOptionElement = document.createElement("option");
                    htmlOptionElement.setAttribute("value", JSON.stringify(info));
                    htmlOptionElement.innerText = "usbProductId=" + info.usbProductId + "," + "usbVendorId=" + info.usbVendorId;
                    if (saved
                        && saved.usbVendorId === info.usbVendorId
                        && saved.usbProductId === info.usbProductId) {
                        htmlOptionElement.setAttribute("selected", "selected");
                    }
                    selector.appendChild(htmlOptionElement);
                }
            })
            .catch(e => {
                alert(e.message);
            })

        if (settings.mouseClickMode) {
            let selector = document.querySelector("#choice5");
            for (let i = 0; i < selector.options.length; i++) {
                let option = selector.options[i];
                if (option.value === settings.mouseClickMode) {
                    option.setAttribute("selected", "selected");
                }
            }
        }

        let baudSelector = document.querySelector("#choice6");
        for (let i = 0; i < baudSelector.options.length; i++) {
            let option = baudSelector.options[i];
            if (parseInt(option.value) === (settings.baudRate || 9600)) {
                option.setAttribute("selected", "selected");
            }
        }
    }

    function savedSerialFilter(settings) {
        if (!settings.usb || !settings.usb.deviceId) {
            return null;
        }
        try {
            return typeof settings.usb.deviceId === "string"
                ? JSON.parse(settings.usb.deviceId)
                : settings.usb.deviceId;
        } catch (e) {
            return null;
        }
    }

    // 下拉框里当前选中的端口优先：用户可能刚选好还没点保存
    function selectedSerialFilter() {
        let element = document.querySelector("#choice2");
        if (!element || element.selectedOptions.length === 0) {
            return null;
        }
        try {
            return JSON.parse(element.selectedOptions[0].value);
        } catch (e) {
            return null;
        }
    }

    function matchPort(ports, filter) {
        if (!filter) {
            return null;
        }
        for (let i = 0; i < ports.length; i++) {
            let info = ports[i].getInfo();
            if (info.usbVendorId === filter.usbVendorId && info.usbProductId === filter.usbProductId) {
                return ports[i];
            }
        }
        return null;
    }

    async function applyBaudRate() {
        let target = parseInt(document.querySelector("#choice6").value);
        let settings = JSON.parse(window.localStorage.getItem("settings") || "{}");
        let ports = await navigator.serial.getPorts();
        if (ports.length === 0) {
            alert("这个网址下还没有授权任何串口。请先点「点我授权键鼠控制器」。");
            return;
        }

        let filter = selectedSerialFilter() || savedSerialFilter(settings);
        let port = matchPort(ports, filter);
        if (!port) {
            if (ports.length === 1) {
                port = ports[0];
            } else {
                alert("有多个已授权的串口，请先在上面的下拉框里选中 CH9329 那个再写入。");
                return;
            }
        }
        console.log("写入波特率使用的串口：", port.getInfo());

        let connection = await Ch9329.connect(port, Ch9329.BAUD_RATES, true);
        if (!connection.info) {
            await connection.ch.dispose();
            try {
                await port.close();
            } catch (e) {
            }
            let detail = Ch9329.describeAttempts(connection.attempts);
            console.warn("CH9329 波特率探测失败：", connection.attempts);
            alert("CH9329 没有应答，无法写入波特率。\n\n探测结果：" + detail
                + "\n\n如果显示「打不开串口」，多半是 KVM 页面还占着这个端口，先关掉其它标签页再试。");
            return;
        }
        let result = await connection.ch.setBaudRate(target);
        await connection.ch.dispose();
        try {
            await port.close();
        } catch (e) {
        }
        if (!result.ok) {
            alert("写入失败：" + result.reason);
            return;
        }

        settings.baudRate = target;
        window.localStorage.setItem("settings", JSON.stringify(settings));
        if (result.unchanged) {
            alert("芯片波特率已经是 " + target + "，无需改动。");
            return;
        }
        alert("已写入 " + target + "。请把 CH9329 断电重插（拔掉 USB 再插回）后生效。");
    }

    function save() {
        let choice1 = document.querySelector("#choice1");
        let video = {}
        if (choice1.selectedOptions.length > 0) {
            let videoSelector = choice1.selectedOptions[0];
            let videoLabel = videoSelector.innerText;
            let videoDeviceId = videoSelector.value;
            video.label = videoLabel;
            video.deviceId = videoDeviceId;
        }

        let choice3 = document.querySelector("#choice3");
        let audio = {};
        if (choice3.selectedOptions.length > 0) {
            let option = choice3.selectedOptions[0];
            let audioLabel = option.innerText;
            let audioDeviceId = option.value;
            audio.label = audioLabel;
            audio.deviceId = audioDeviceId;
        }

        let usb = {}
        let usbElement = document.querySelector("#choice2");
        if (usbElement.selectedOptions.length > 0) {
            let option = usbElement.selectedOptions[0];
            let usbLabel = option.innerText;
            let usbDeviceId = option.value;
            usb.label = usbLabel;
            usb.deviceId = usbDeviceId;
        }
        let resolution = {width: 1920, height: 1080};
        let resolutionElement = document.querySelector("#choice4");
        if (resolutionElement.selectedOptions.length > 0) {
            let option = resolutionElement.selectedOptions[0];
            let split = option.value.split("x");
            resolution.width = parseInt(split[0]);
            resolution.height = parseInt(split[1]);
        }

        let config = {
            video: video,
            audio: audio,
            usb: usb,
            resolution: resolution,
            mouseClickMode: "absolute",
            mouseModeVersion: 1,
            baudRate: parseInt(document.querySelector("#choice6").value) || 9600
        };
        let mouseClickMode = document.querySelector("#choice5");
        if (mouseClickMode.value === "absolute" || mouseClickMode.value === "relative") {
            config.mouseClickMode = mouseClickMode.value;
        }

        window.localStorage.setItem("settings", JSON.stringify(config));
        alert("保存成功")
        window.location.reload();
    }

    function renderUsed() {
        let settingStr = window.localStorage.getItem("settings");
        if (!settingStr) {
            return;
        }
        let settings = migrateSettings(JSON.parse(settingStr));
        let video = settings.video;
        if (video) {
            document.querySelector("#usedVideo").innerText = "当前使用的视频设备:\n" + video.label;
        }
        let audio = settings.audio;
        if (audio) {
            document.querySelector("#usedAudio").innerText = "当前使用的音频设备:\n" + audio.label;
        }
        let usb = settings.usb;
        if (usb) {
            document.querySelector("#usedUsb").innerText = "当前使用的控制器:\n" + usb.label;
        }
    }

    renderMedia();
    renderUsb();
    renderUsed();

    (function clearServiceWorkerAndCaches() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                    return Promise.all(registrations.map(function (registration) {
                        return registration.unregister();
                    }));
                })
                .catch(function () {});
        }
        if (typeof caches !== 'undefined' && caches.keys) {
            caches.keys()
                .then(function (keys) {
                    return Promise.all(keys.map(function (key) {
                        return caches.delete(key);
                    }));
                })
                .catch(function () {});
        }
    })();
</script>
</html>

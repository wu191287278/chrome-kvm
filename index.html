<!DOCTYPE html>
<html>
<head lang="zh" title="winkvm">
    <meta charset="utf-8">
    <title>Chrome KVM</title>
    <meta name="description" content="Chrome KVM">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
</head>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    /* 工具栏样式 */
    .floating-toolbar {
        position: fixed;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        background-color: #333;
        color: white;
        padding: 10px;
        border-radius: 0 5px 5px 0;
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        transition: transform 0.3s, opacity 0.3s;
    }

    /* 隐藏的样式 */
    .floating-toolbar.hidden {
        transform: translate(-90%, -50%);
    }

    /* 按钮样式 */
    .floating-toolbar button {
        display: block;
        width: 40px;
        height: 40px;
        margin: 5px 0;
        border: none;
        background-color: #555;
        color: white;
        font-size: 16px;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .floating-toolbar button:hover {
        background-color: #777;
    }

    /* 连接状态指示：灰=未连接，绿=正常，黄=可用但有问题，红=失败 */
    #statusButton {
        font-size: 20px;
        line-height: 1;
    }

    #statusButton.status-idle {
        color: #999;
    }

    #statusButton.status-ok {
        color: #3ddc84;
    }

    #statusButton.status-warn {
        color: #ffc107;
    }

    #statusButton.status-error {
        color: #ff5252;
    }

    /* 工具提示文字 */
    .tooltip {
        position: absolute;
        top: 50%;
        left: 100%;
        transform: translateY(-50%);
        background-color: #333;
        color: white;
        padding: 5px 10px;
        border-radius: 3px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .floating-toolbar button:hover .tooltip {
        opacity: 1;
    }

    /* 显示/隐藏箭头按钮样式 */
    .toggle-button {
        width: 30px;
        height: 30px;
        margin: 5px 0;
        border: none;
        background-color: #555;
        color: white;
        font-size: 10px;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .toggle-button:hover {
        background-color: #777;
    }

    /* 隐藏状态时箭头按钮样式 */
    .floating-toolbar.hidden .toggle-button {
        position: absolute;
        top: 50%;
        left: 100%;
        transform: translateY(-50%);
        background-color: #333;
        width: 10px;
        height: 20px;
        font-size: 8px;
        border-radius: 5px 0 0 5px;
    }
</style>

<body>
<div id="container" style="width: 100%;height: 100%;cursor: none">
    <video id="video" playsinline autoplay style="width: 100%;height:100%;cursor: none"></video>
    <button id="authSerial" style="display: none"></button>
</div>
<div class="floating-toolbar hidden">
    <button onclick="refreshStatus()" id="statusButton" class="status-idle">
        ●
        <span class="tooltip" id="statusTooltip">未连接串口</span>
    </button>
    <button onclick="toggleFullScreen()">
        🖥️
        <span class="tooltip">全屏</span>
    </button>
    <button onclick="startRecord()" id="startRecordStatus">
        📹
        <span class="tooltip">录制</span>
    </button>
    <button onclick="stopRecord()" id="stopRecordStatus" style="display: none">
        ⏺️
        <span class="tooltip">停止录制</span>
    </button>
    <button onclick="window.location.href='settings.html'">
        ⚙️
        <span class="tooltip">设置</span>
    </button>
    <button onclick="ctrlAltDel()">
        ⚡️
        <span class="tooltip">Ctrl+Alt+Delete</span>
    </button>
    <button onclick="pasteText()">
        📋
        <span class="tooltip">粘贴文本</span>
    </button>
    <button onclick="releaseAllInput()">
        🔓
        <span class="tooltip">强制松开所有键</span>
    </button>
    <button onclick="window.location.reload()">
        ♻
        <span class="tooltip">刷新</span>
    </button>
    <button class="toggle-button" onclick="toggleToolbar()">
        ️》
        <span class="tooltip">隐藏</span>
    </button>
</div>
</body>
<script src="ch9329.js"></script>
<script>

    let videoElement = document.getElementById("video");
    let containerElement = document.getElementById("container");
    let globalWidth = 1920;
    let globalHeight = 1080;
    let ch;

    function migrateSettings(settings) {
        if (!settings) {
            return settings;
        }
        // 旧版「绝对模式」实际写入 relative；无版本号时迁回 absolute。
        // 已是 absolute 的配置（含修复后重存）保持不变。
        if (!settings.mouseModeVersion) {
            if (settings.mouseClickMode !== "absolute") {
                settings.mouseClickMode = "absolute";
            }
            settings.mouseModeVersion = 1;
            window.localStorage.setItem("settings", JSON.stringify(settings));
        }
        return settings;
    }

    function start(devices) {
        let settingsStr = window.localStorage.getItem("settings");
        if (!settingsStr) {
            window.location.href = "settings.html";
            return;
        }

        let settings = migrateSettings(JSON.parse(settingsStr));
        let video = settings.video;
        if (!settings.video || !settings.video.deviceId) {
            return;
        }
        let audio = undefined;
        if (settings.audio && settings.audio.deviceId) {
            audio = {
                deviceId: {exact: settings.audio.deviceId},
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        }

        let screen = settings.resolution;
        let width = globalWidth;
        let height = globalHeight;
        if (screen && screen.width && screen.height) {
            width = screen.width;
            height = screen.height;
        }

        openMedia(video.deviceId, audio, width, height)
            .then(stream => {
                videoElement.srcObject = stream;
                if (typeof devices === "function") {
                    devices();
                }
            })
            .catch(function (e) {
                alert(e && e.message ? e.message : String(e));
            });

        if (settings.usb && settings.usb.deviceId) {
            openSerial(settings.usb.deviceId, settings.mouseClickMode);
        }
    }

    function openMedia(videoDeviceId, audio, width, height) {
        // exact 分辨率极易 Overconstrained；按 ideal → 放宽 → 仅设备 回退
        let attempts = [
            {
                audio: audio,
                video: {
                    deviceId: {exact: videoDeviceId},
                    width: {ideal: width},
                    height: {ideal: height}
                }
            },
            {
                audio: audio,
                video: {
                    deviceId: {exact: videoDeviceId},
                    width: {ideal: width}
                }
            },
            {
                audio: audio,
                video: {
                    deviceId: {exact: videoDeviceId}
                }
            }
        ];
        let chain = Promise.reject(new Error("init"));
        for (let i = 0; i < attempts.length; i++) {
            (function (constraints) {
                chain = chain.catch(function () {
                    return navigator.mediaDevices.getUserMedia(constraints);
                });
            })(attempts[i]);
        }
        return chain;
    }

    function parseUsbFilter(deviceId) {
        if (!deviceId) {
            return null;
        }
        if (typeof deviceId === "object") {
            return deviceId;
        }
        try {
            return JSON.parse(deviceId);
        } catch (e) {
            return null;
        }
    }

    function pickSerialPort(ports, deviceId) {
        if (!ports || ports.length === 0) {
            return null;
        }
        let filter = parseUsbFilter(deviceId);
        if (!filter || (filter.usbVendorId == null && filter.usbProductId == null)) {
            // 没有可用的筛选条件时只在唯一端口下自动选，否则宁可报错也不要开错设备
            return ports.length === 1 ? ports[0] : null;
        }
        for (let i = 0; i < ports.length; i++) {
            let info = ports[i].getInfo();
            let vendorOk = filter.usbVendorId == null || info.usbVendorId === filter.usbVendorId;
            let productOk = filter.usbProductId == null || info.usbProductId === filter.usbProductId;
            if (vendorOk && productOk) {
                return ports[i];
            }
        }
        return null;
    }

    let currentBaudRate = null;
    let activePort = null;
    let lastSerialArgs = null;
    let serialLost = false;

    function setStatus(level, lines) {
        let button = document.querySelector("#statusButton");
        let tooltip = document.querySelector("#statusTooltip");
        if (!button || !tooltip) {
            return;
        }
        button.className = "status-" + level;
        tooltip.innerHTML = lines.join("<br>");
    }

    function renderStatus(info) {
        if (!ch) {
            setStatus("idle", ["未连接串口"]);
            return;
        }
        if (serialLost) {
            setStatus("error", ["串口已断开", "插回 CH9329 后会自动重连", "或点此立即重试"]);
            return;
        }
        let level = "ok";
        let lines = [];
        if (!info) {
            level = "error";
            lines.push("芯片无应答");
        } else {
            lines.push("固件 " + info.version);
            lines.push(info.usbConnected ? "USB 已枚举" : "USB 未枚举");
            if (!info.usbConnected) {
                level = "warn";
            }
            if (info.asleep) {
                lines.push("被控端已休眠");
                level = "warn";
            }
            lines.push(info.capsLock ? "Caps Lock 开" : "Caps Lock 关");
        }
        if (!ch.isAckEnabled()) {
            lines.push("已降级为只发不等");
            level = level === "ok" ? "warn" : level;
        }
        if (currentBaudRate) {
            lines.push(currentBaudRate + " bps");
        }
        lines.push("点击刷新");
        setStatus(level, lines);
    }

    async function refreshStatus() {
        if (!ch) {
            renderStatus(null);
            return;
        }
        if (serialLost) {
            reconnectSerial();
            return;
        }
        renderStatus(await ch.getInfo());
    }

    function handleSerialLost() {
        if (serialLost) {
            return;
        }
        serialLost = true;
        if (ch) {
            ch.markDisconnected();
        }
        console.warn("CH9329 串口已断开");
        renderStatus(null);
    }

    function reconnectSerial() {
        if (!lastSerialArgs) {
            return;
        }
        setStatus("warn", ["正在重连…"]);
        openSerial(lastSerialArgs.deviceId, lastSerialArgs.mouseClickMode);
    }

    // 拔掉 CH9329 时串口写入只会静默失败，必须靠 disconnect 事件才能让界面知道
    function bindSerialLifecycle() {
        if (!navigator.serial || window.__chromeKvmSerialBound) {
            return;
        }
        window.__chromeKvmSerialBound = true;
        navigator.serial.addEventListener("disconnect", function (event) {
            if (activePort && event.target !== activePort) {
                return;
            }
            handleSerialLost();
        });
        navigator.serial.addEventListener("connect", function () {
            if (serialLost) {
                reconnectSerial();
            }
        });
    }

    function candidateBaudRates() {
        let saved = null;
        try {
            let settings = JSON.parse(window.localStorage.getItem("settings") || "{}");
            saved = settings.baudRate;
        } catch (e) {
        }
        let list = Ch9329.BAUD_RATES.slice();
        if (saved && list.indexOf(saved) !== -1) {
            list.splice(list.indexOf(saved), 1);
            list.unshift(saved);
        }
        return list;
    }

    function rememberBaudRate(baudRate) {
        try {
            let settings = JSON.parse(window.localStorage.getItem("settings") || "{}");
            if (settings.baudRate === baudRate) {
                return;
            }
            settings.baudRate = baudRate;
            window.localStorage.setItem("settings", JSON.stringify(settings));
        } catch (e) {
        }
    }

    function openSerial(deviceId, mouseClickMode) {
        lastSerialArgs = {deviceId: deviceId, mouseClickMode: mouseClickMode};
        bindSerialLifecycle();
        navigator.serial.getPorts()
            .then(async function (ports) {
                let port = pickSerialPort(ports, deviceId);
                if (!port) {
                    // 重连途中设备还没回来是正常的，别拿弹窗打断用户
                    if (serialLost) {
                        renderStatus(null);
                        return;
                    }
                    alert("未检测到所选串口设备。请到设置页重新授权并选择正确的 CH9329 端口。");
                    return;
                }
                let mouseAbsolute = !mouseClickMode || mouseClickMode === "absolute";
                // 芯片实际波特率以探测结果为准，设置里的值只作为首选，避免配置不同步就连不上
                let connection = await Ch9329.connect(port, candidateBaudRates(), mouseAbsolute);
                ch = connection.ch;
                ch.onTransportError = handleSerialLost;
                activePort = port;
                serialLost = false;
                currentBaudRate = connection.baudRate;
                open();
                let info = connection.info;
                renderStatus(info);
                if (!info) {
                    console.warn("CH9329 未应答 GET_INFO，命令将退化为不等应答发送");
                    return;
                }
                console.log("CH9329", info, "baudRate=" + connection.baudRate);
                rememberBaudRate(connection.baudRate);
                if (!info.usbConnected) {
                    alert("CH9329 的 USB 未被被控端枚举，请检查接到被控机的 USB 线。");
                }
            })
            .catch(function (e) {
                if (serialLost) {
                    console.warn("重连失败", e);
                    renderStatus(null);
                    return;
                }
                alert(e && e.message ? e.message : String(e));
            });
    }

    function open() {
        if (window.__chromeKvmInputBound) {
            return;
        }
        window.__chromeKvmInputBound = true;

        videoElement.style.cursor = "none";
        document.addEventListener('keydown', (event) => {
            event.preventDefault()
            if (!ch) {
                return;
            }
            ch.keydown(event.code);
        })

        document.addEventListener('keyup', (event) => {
            event.preventDefault();
            if (!ch) {
                return;
            }
            ch.keyup(event.code);
        });

        // 累积滚动量再按齿数下发，保留滚动快慢；一格滚轮在 Chrome 里约 100px
        const WHEEL_PIXELS_PER_NOTCH = 100;
        let wheelPixels = 0;
        document.addEventListener('wheel', function (event) {
            if (!ch) {
                return;
            }
            let delta = event.deltaY;
            if (event.deltaMode === 1) {
                delta *= 16;   // 行
            } else if (event.deltaMode === 2) {
                delta *= 400;  // 页
            }
            wheelPixels += delta;
            let notches = Math.trunc(wheelPixels / WHEEL_PIXELS_PER_NOTCH);
            if (notches === 0) {
                return;
            }
            wheelPixels -= notches * WHEEL_PIXELS_PER_NOTCH;
            // 浏览器 deltaY 向下为正，协议齿数向上为正
            ch.mouseScroll(-notches);
        }, {passive: true});

        videoElement.addEventListener('mousemove', (event) => {
            if (!ch) {
                return;
            }
            ch.mouseMove(videoElement, event.clientX, event.clientY);
        });


        videoElement.addEventListener('mousedown', (event) => {
            event.preventDefault();
            if (!ch) {
                return;
            }
            let buttons = 0x00;
            if (event.button === 0) {
                buttons = 0x01;
            } else if (event.button === 1) {
                buttons = 0x04;
            } else if (event.button === 2) {
                buttons = 0x02;
            }
            if (buttons) {
                ch.mouseButtonDown(videoElement, event.clientX, event.clientY, buttons);
            }
        });
        videoElement.addEventListener('contextmenu', (event) => {
            event.preventDefault();
        });
        // 用 document 捕获，避免移出 video 时丢右键抬起；按 button 位释放
        document.addEventListener('mouseup', (event) => {
            if (!ch) {
                return;
            }
            ch.mouseButtonUp(event.button);
        });

        // 失焦/切走页面时强制松开所有键，防止被控端卡住
        window.addEventListener('blur', () => {
            if (ch) {
                ch.forceReleaseAllInput();
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && ch) {
                ch.forceReleaseAllInput();
            }
        });

    }

    document.addEventListener('DOMContentLoaded', () => {
        start()
    });

    // 切换工具栏的显示和隐藏
    function toggleToolbar() {
        const toolbar = document.querySelector('.floating-toolbar');
        toolbar.classList.toggle('hidden');
        const toggleButton = toolbar.querySelector('.toggle-button');
        toggleButton.innerHTML = toolbar.classList.contains('hidden') ? '》' : '⬅';
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            // 进入全屏
            document.documentElement.requestFullscreen();
        } else {
            // 退出全屏
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    let mediaRecorder;

    function recordFileName() {
        let date = new Date();
        let pad = function (value) {
            return String(value).padStart(2, "0");
        };
        // getMonth 从 0 开始，getDate 才是几号（原来误用了 getDay，拿到的是星期几）
        return date.getFullYear()
            + pad(date.getMonth() + 1)
            + pad(date.getDate())
            + "-"
            + pad(date.getHours())
            + pad(date.getMinutes())
            + pad(date.getSeconds())
            + ".webm";
    }

    function startRecord() {
        document.querySelector("#startRecordStatus").style.display = "none";
        document.querySelector("#stopRecordStatus").style.display = "block";
        if (mediaRecorder) {
            mediaRecorder.stop();
        }
        const stream = videoElement.srcObject;

        // 将MediaStream转换为Blob数据
        mediaRecorder = new MediaRecorder(stream, {
            mimeType: 'video/webm'
        });

        // 创建一个空数组来保存录制的Blob对象
        const chunks = [];

        // 监听dataavailable事件来收集Blob数据
        mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
                chunks.push(event.data);
            }
        };

        // 监听stop事件来处理录制完成后的操作
        mediaRecorder.onstop = () => {
            // 创建一个Blob URL来播放录制的视频
            const blob = new Blob(chunks, {type: 'video/webm'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = recordFileName();
            a.click();
            URL.revokeObjectURL(url);
        };

        // 开始录制
        mediaRecorder.start();
    }

    function stopRecord() {
        if (mediaRecorder) {
            mediaRecorder.stop();
        }

        document.querySelector("#startRecordStatus").style.display = "block";
        document.querySelector("#stopRecordStatus").style.display = "none";
    }

    async function pasteText() {
        if (!ch) {
            alert("键鼠设备未连接");
            return;
        }
        try {
            let text = await navigator.clipboard.readText();
            if (!text) {
                alert("剪贴板为空");
                return;
            }
            let result = await ch.typeText(text);
            if (result.skipped > 0) {
                alert("已粘贴 " + result.typed + " 个字符，跳过 " + result.skipped + " 个不支持字符（如中文）");
            }
        } catch (e) {
            alert("读取剪贴板失败：请先允许剪贴板权限，或确认页面在安全上下文中打开");
        }
    }

    function paste() {
        pasteText();
    }

    function ctrlAltDel() {
        if (!ch) {
            return;
        }
        ch.sendCtrlAltDelete();
    }

    function releaseAllInput() {
        if (!ch) {
            return;
        }
        ch.forceReleaseAllInput();
    }

    // 卸载 Service Worker 并清空 Cache Storage，不再使用 SW 缓存
    (function clearServiceWorkerAndCaches() {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                    return Promise.all(registrations.map(function (registration) {
                        return registration.unregister();
                    }));
                })
                .catch(function () {});
        }
        if (typeof caches !== 'undefined' && caches.keys) {
            caches.keys()
                .then(function (keys) {
                    return Promise.all(keys.map(function (key) {
                        return caches.delete(key);
                    }));
                })
                .catch(function () {});
        }
    })();
</script>
</html>
